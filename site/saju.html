<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>기획 공부 — 사주 DB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="saju">
<nav class="topnav" aria-label="메뉴">
  <a href="index.html">이론</a>
  <a href="reports.html">시장 리포트</a>

  <span class="grow"></span><button class="ib" id="theme" aria-label="테마 바꾸기" title="테마 바꾸기"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
</nav>
<div class="wrap" style="max-width:1600px">
  <h1>사주 DB</h1>
  <p class="desc" id="sjdesc">DB를 불러오는 중…</p>
  <p class="note sj-note">포스텔러 유튜브 채널 영상(2024.04~2026.11)의 자동 자막을 읽고 해석 규칙을 요약한 연구용 자료입니다. 채널의 공식 자료가 아니며, 자막 오기와 요약 오류가 있을 수 있습니다. 판단할 때는 근거 시간을 눌러 원본 영상으로 확인하세요. 표준 대조는 일반 명리 이론과 비교해 붙인 표시이고 전문가 감수를 거치지 않았습니다.</p>
  <div class="dbtabs" id="sjtabs" role="tablist"></div>
  <div class="dbfilter" id="sjfilter">
    <input type="search" id="q" placeholder="찾기 (예: 일지 편관, 원진, 도화, 갑목)" aria-label="검색">
    <select id="fdomain" aria-label="영역"><option value="">영역 전체</option></select>
    <select id="fcheck" aria-label="표준 대조"><option value="">표준 대조 전체</option></select>
    <select id="forigin" aria-label="출처 유형"><option value="">출처 유형 전체</option></select>
    <select id="fconf" aria-label="확신도"><option value="">확신도 전체</option><option>단정</option><option>경향</option><option>농담</option></select>
    <select id="fspeaker" aria-label="화자"><option value="">화자 전체</option></select>
    <label class="sj-check"><input type="checkbox" id="fnojoke"> 농담·오락 숨기기</label>
    <button class="btn sm" id="freset">초기화</button>
  </div>
  <div class="dbgrid">
    <div><p class="status" id="cnt" style="margin:0 0 8px"></p><div class="dblist" id="list"></div></div>
    <aside class="dbside idle" id="side" aria-live="polite"><p class="empty">항목을 누르면 자세한 내용과 근거 영상이 보여요</p></aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="shared.js"></script>
<script src="saju-page.js"></script>
</body>
</html>
